[benchmark]
warmups = 3
samples = 30
seed = 10015
enabled_problems = [
  "nnls_tiny",
  "nnls_small",
  "nnls_medium",
  "nnls_large",
  "nnls_xlarge",
  "box_qp_tiny",
  "box_qp_small",
  "box_qp_medium",
  "box_qp_large",
  "box_qp_xlarge",
  "parametric_quad_form_tiny",
  "parametric_quad_form_small",
  "parametric_quad_form_medium",
  "parametric_quad_form_large",
  "parametric_quad_form_xlarge",
  "socp_tiny",
  "socp_small",
  "socp_medium",
  "socp_large",
  "socp_xlarge",
  "trace_sdp_tiny",
  "trace_sdp_small",
  "trace_sdp_medium",
  "trace_sdp_large",
  "trace_sdp_xlarge",
  "covariance_sdp_tiny",
  "covariance_sdp_small",
  "covariance_sdp_medium",
  "covariance_sdp_large",
  "covariance_sdp_xlarge",
  "flow_lp_tiny",
  "flow_lp_small",
  "flow_lp_medium",
  "flow_lp_large",
  "flow_lp_xlarge",
  "mpc_tiny",
  "mpc_small",
  "mpc_medium",
  "mpc_large",
  "mpc_xlarge",
  "portfolio_tiny",
  "portfolio_small",
  "portfolio_medium",
  "portfolio_large",
  "portfolio_xlarge",
]
enabled_tools = [
  "cvxpy_direct",
  "cgr_python",
  "cgr_rust",
  "cvxpygen",
  "cvxpygen_c",
]

[tool_skips]
parametric_quad_form = ["cvxpygen", "cvxpygen_c"]
trace_sdp = ["cvxpygen", "cvxpygen_c"]
covariance_sdp = ["cvxpygen", "cvxpygen_c"]

[paths]
artifacts_dir = "artifacts"
generated_dir = "artifacts/generated"
results_dir = "results"

[cvxpy]
solver = "CLARABEL"

[cvxpygen]
solver = "CLARABEL"

[rust]
release = true
